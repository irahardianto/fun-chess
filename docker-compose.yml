services:
  fun-chess:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fun-chess
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LAN_IP=${LAN_IP:-}
      - HOST_IP=${HOST_IP:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - CLIENT_URL=${CLIENT_URL:-}
      - CLIENT_DIST_PATH=${CLIENT_DIST_PATH:-/app/apps/client/dist}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Security & Secrets Configuration (MIN-002):
      # SESSION_SECRET is strictly required when NODE_ENV=production (minimum 16 characters).
      # For production deployments, supply a cryptographically secure random secret:
      #   export SESSION_SECRET=$(openssl rand -base64 32)
      # A development fallback is provided below so local compose testing starts cleanly out-of-the-box.
      - SESSION_SECRET=${SESSION_SECRET:-dev-insecure-docker-compose-session-secret-min16chars}
      # METRICS_SECRET authorizes telemetry (/metrics) and deep health probes (/health/detail).
      # Optional in development; recommended in production (minimum 8 characters when set).
      - METRICS_SECRET=${METRICS_SECRET:-dev-metrics-secret-min8chars}
      - MAX_ROOMS=${MAX_ROOMS:-10000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-10000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-60}
      - RATE_LIMIT_ROOM_CREATE_MAX=${RATE_LIMIT_ROOM_CREATE_MAX:-3}
      - RATE_LIMIT_MAX_KEYS=${RATE_LIMIT_MAX_KEYS:-10000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
