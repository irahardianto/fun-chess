services:
  fun-chess:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fun-chess
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LAN_IP=${LAN_IP:-}
      - HOST_IP=${HOST_IP:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - CLIENT_URL=${CLIENT_URL:-}
      - CLIENT_DIST_PATH=${CLIENT_DIST_PATH:-/app/apps/client/dist}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Security & Secrets Configuration (CRIT-001):
      # SESSION_SECRET and METRICS_SECRET must be explicitly supplied in the environment.
      # Default fallback secrets have been eliminated to prevent insecure deployments.
      # Example:
      #   export SESSION_SECRET=$(openssl rand -base64 32)
      #   export METRICS_SECRET=$(openssl rand -hex 16)
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - METRICS_SECRET=${METRICS_SECRET:?METRICS_SECRET must be set}
      - MAX_ROOMS=${MAX_ROOMS:-10000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-10000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-60}
      - RATE_LIMIT_ROOM_CREATE_MAX=${RATE_LIMIT_ROOM_CREATE_MAX:-3}
      - RATE_LIMIT_MAX_KEYS=${RATE_LIMIT_MAX_KEYS:-10000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
